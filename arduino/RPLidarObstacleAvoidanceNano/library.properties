sentence=Encoder-assisted RPLidar A1M8 obstacle avoidance for Arduino Nano 33 IoT + Nano Motor Carrier.
paragraph=Parses the RPLidar A1M8 serial protocol and integrates with the Arduino Nano Motor Carrier (Arduino_MotorCarrier library). Uses the quadrature encoders on Pololu 4751 gearmotors (19:1 gear ratio, 64 CPR, 4864 ticks/rev) to execute precise encoder-based turns and backup distances, with differential speed correction, stall detection, and a high-level getRecommendedDirection() API.
